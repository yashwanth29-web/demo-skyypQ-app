<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SkYppQ - Order before you arrive</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages & Render static hosts
      // Preserves sub-routes on browser page refresh (F5)
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? '&' + l.search.slice(1) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: sans-serif; text-align: center; padding: 50px;">
      <h2>Loading SkYppQ...</h2>
      <p>Redirecting to app route...</p>
    </div>
  </body>
</html>
